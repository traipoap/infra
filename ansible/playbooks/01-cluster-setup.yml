- name: Deploy Lumina Super-Node (LB)
  hosts: load_balance
  become: true
  roles:
    - load-balance

  handlers:
  - name: Restart HAProxy
    service: name=haproxy state=restarted

- name: Initialize K3s Server (first master) and Extract Token
  hosts: k3s_masters
  become: true
  vars:
    is_first_master: "{{ inventory_hostname == groups['k3s_masters'][0] }}"
  roles:
    # - runtime
    - role: k3s-server
      when: is_first_master

  tasks:
    - name: Fetch kubeconfig from Master
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: files/k3s-kubeconfig.yaml
        flat: yes
      when: is_first_master
      run_once: true

    - name: Read K3s Token from Master Node
      # Use slurp to read file and convert to base64 (safe and standard)
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: master_token_encoded
      when: is_first_master

    - name: Decode Token and set as a global fact
      # Convert base64 back to normal string and store in a variable that all Hosts can see
      set_fact:
        k3s_cluster_token: "{{ master_token_encoded['content'] | b64decode | trim }}"
      when: is_first_master

    - name: Debug Token
      debug:
        msg: "Extracted Token is {{ k3s_cluster_token }}"
      no_log: true
      when: is_first_master

- name: Join Additional Master Nodes to the Control Plane
  hosts: k3s_masters
  become: true
  serial: 1
  vars:
    # Explicit node identity — ansible_facts.default_ipv4.address is a heuristic
    # (IP of the first interface in the default route) and returns the WRONG IP
    # on multi-NIC nodes. That is exactly how the LB node joined with a bad IP.
    # Override with k3s_node_ip=<ip> in inventory if needed.
    k3s_node_ip: "{{ hostvars[inventory_hostname].k3s_node_ip | default(inventory_hostname) }}"
    # Every address the API can be reached at (LB + all masters) must be in the server cert.
    k3s_api_sans: "{{ (groups.get('load_balance', []) + groups.get('k3s_masters', [])) | unique | join(',') }}"
  tasks:
    - name: Skip first master (already initialized)
      meta: end_host
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Assert node identity is an explicit IPv4
      ansible.builtin.assert:
        that: k3s_node_ip is match('^\\d{1,3}(\\.\\d{1,3}){3}$')
        fail_msg: "Refusing to join {{ inventory_hostname }} with non-IPv4 identity '{{ k3s_node_ip }}'. Set k3s_node_ip=<ip> in inventory."

    - name: Read K3s Token from first master
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['k3s_masters'][0] }}"
      register: master_token_encoded

    - name: Decode Token
      set_fact:
        cluster_token: "{{ master_token_encoded['content'] | b64decode | trim }}"

    - name: Check K3s Server service status
      command: systemctl is-active k3s
      register: k3s_service_status
      ignore_errors: true
      changed_when: false

    - name: Install and Join K3s Server to Cluster
      when: k3s_service_status.rc != 0
      block:
        - name: Create temporary setup script
          copy:
            dest: /tmp/k3s_server_join.sh
            mode: '0755'
            content: |
              #!/bin/bash
              set -euo pipefail
              curl -sfL https://get.k3s.io | K3S_URL=https://{{ groups['k3s_masters'][0] }}:6443 K3S_TOKEN={{ cluster_token }} sh -s - server \
              --node-ip={{ k3s_node_ip }} \
              --bind-address={{ k3s_node_ip }} \
              --tls-san={{ k3s_api_sans }} \
              --write-kubeconfig-mode 644 \
              --disable=traefik \
              --disable=local-storage

        - name: Execute K3s Server Join
          shell: /tmp/k3s_server_join.sh
          register: install_output

        - name: Cleanup installation script
          file:
            path: /tmp/k3s_server_join.sh
            state: absent

        - name: Show installation output
          debug:
            var: install_output.stdout_lines

      rescue:
        - name: Uninstall half-joined k3s to avoid stale state
          ansible.builtin.shell: |
            curl -sfL https://get.k3s.io | sh -s - uninstall || true
          ignore_errors: true

        - name: Handle Installation Failure
          fail:
            msg: >-
              K3s Server join failed on {{ inventory_hostname }} (identity {{ k3s_node_ip }}).
              A failed join can leave a stale etcd member on the cluster — restarting alone
              will not clear it. From a healthy master run:
              k3s kubectl delete node {{ inventory_hostname }} and
              k3s etcd -- member list (then: k3s etcd -- member remove <ID>).
              Also check connectivity to {{ groups['k3s_masters'][0] }}:6443 and the Cluster Token.

    - name: Verify K3s Server is Up and Running
      command: systemctl is-active k3s
      register: final_check
      changed_when: false
      failed_when: final_check.rc != 0

    - name: Verify node registered with expected InternalIP
      ansible.builtin.command: k3s kubectl get nodes -o wide
      delegate_to: "{{ groups['k3s_masters'][0] }}"
      register: nodes_wide
      changed_when: false
      retries: 15
      delay: 10
      until: k3s_node_ip in nodes_wide.stdout
      failed_when: k3s_node_ip not in nodes_wide.stdout

- name: Prepare Workers with Join Information
  hosts: k3s_workers
  become: true
  vars:
    # Get the token we prepared in the previous step
    cluster_token: "{{ hostvars[groups['k3s_masters'][0]]['k3s_cluster_token'] }}"
    master_ip: "{{ groups['k3s_masters'][0] }}"
    # Explicit node identity for the agent (same heuristic-IP rationale as the master join)
    k3s_node_ip: "{{ hostvars[inventory_hostname].k3s_node_ip | default(inventory_hostname) }}"
  roles:
    # - runtime
    - k3s-agent

- name: Replace server kubeconfig playbooks/files/k3s-kubeconfig.yaml
  hosts: localhost
  vars:
    # Route kubectl traffic through the load balancer; fall back to the first master if none is defined
    k3s_api_server: "{{ (groups['load_balance'] + groups['k3s_masters']) | first }}"
  tasks:
    - name: Replace kubeconfig content
      ansible.builtin.replace:
        path: files/k3s-kubeconfig.yaml
        regexp: "server: https://127.0.0.1:6443"
        replace: "server: https://{{ k3s_api_server }}:6443"
    - name: Copy kubeconfig to local machine
      ansible.builtin.copy:
        src: files/k3s-kubeconfig.yaml
        dest: ~/.kube/config
        mode: '0600'
